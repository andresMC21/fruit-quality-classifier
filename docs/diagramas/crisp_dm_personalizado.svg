<svg xmlns="http://www.w3.org/2000/svg" width="890" height="580" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs>
<text x="30" y="40" font-size="20" font-weight="bold">CRISP-DM adaptado: clasificador de calidad y tamaño de frutas</text>
<text x="30" y="64" font-size="13" fill="#555">Iteraciones reales del proyecto (notas al pie); el flujo principal avanza de 1 a 6.</text>
<rect x="30" y="90" width="250" height="150" rx="10" fill="#dbe8f5" stroke="#444"/>
<text x="42" y="118" font-size="15" font-weight="bold">1. Comprensión del negocio</text>
<text x="44" y="148" font-size="13">• Calidad + tamaño de 6 frutas</text>
<text x="44" y="174" font-size="13">• Costo asimétrico de errores</text>
<text x="44" y="200" font-size="13">• Métrica: F1 macro, recall(mala)</text>
<rect x="320" y="90" width="250" height="150" rx="10" fill="#e3f0dc" stroke="#444"/>
<text x="332" y="118" font-size="15" font-weight="bold">2. Comprensión de los datos</text>
<text x="334" y="148" font-size="13">• Kaggle + Fruit grade + propias</text>
<text x="334" y="174" font-size="13">• &#x27;regular&#x27; solo en Fruit grade</text>
<text x="334" y="200" font-size="13">• Fuente adivinable: 98,8 %</text>
<rect x="610" y="90" width="250" height="150" rx="10" fill="#fdf0d5" stroke="#444"/>
<text x="622" y="118" font-size="15" font-weight="bold">3. Preparación de los datos</text>
<text x="624" y="148" font-size="13">• pHash + ráfagas → 6 012 grupos</text>
<text x="624" y="174" font-size="13">• Otsu / GrabCut, fondo gris</text>
<text x="624" y="200" font-size="13">• Split agrupado por fruit_id</text>
<rect x="30" y="280" width="250" height="150" rx="10" fill="#f6dede" stroke="#444"/>
<text x="42" y="308" font-size="15" font-weight="bold">4. Modelado</text>
<text x="44" y="338" font-size="13">• Base: mayoritaria, logreg</text>
<text x="44" y="364" font-size="13">• SVM, Random Forest (CV agrupada)</text>
<text x="44" y="390" font-size="13">• CNN 3 conv. desde cero</text>
<rect x="320" y="280" width="250" height="150" rx="10" fill="#e6dcf0" stroke="#444"/>
<text x="332" y="308" font-size="15" font-weight="bold">5. Evaluación</text>
<text x="334" y="338" font-size="13">• Test una sola vez + McNemar</text>
<text x="334" y="364" font-size="13">• Por especie y por fuente</text>
<text x="334" y="390" font-size="13">• Costo esperado, recall(mala)</text>
<rect x="610" y="280" width="250" height="150" rx="10" fill="#d8eceb" stroke="#444"/>
<text x="622" y="308" font-size="15" font-weight="bold">6. Despliegue</text>
<text x="624" y="338" font-size="13">• predict.py único</text>
<text x="624" y="364" font-size="13">• Streamlit + selector de modelo</text>
<text x="624" y="390" font-size="13">• Rechazo: no reconocida / revisión</text>
<path d="M280,165  L320,165" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M570,165  L610,165" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M735,240  L155,280" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M280,355  L320,355" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M570,355  L610,355" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/>
<text x="30" y="450" font-size="12.5" fill="#333">Iteración 3→2: el EDA mostró ráfagas casi idénticas (12 909 imágenes en 6 012 grupos) → se limitó a 3 imágenes por grupo y se agrupó el split.</text>
<text x="30" y="474" font-size="12.5" fill="#333">Iteración 3→3: la segmentación fallaba en banano y lima por un control de forma demasiado estricto → umbrales por especie y re-segmentación.</text>
<text x="30" y="498" font-size="12.5" fill="#333">Iteración 4→3: la CNN subajustada (79 %) → más filtros, aumento más suave y tasa de aprendizaje por época.</text>
<text x="30" y="522" font-size="12.5" fill="#333">Regla de la fase 5: el test se evalúa una sola vez, una sola vez y con el split congelado; el test externo (otra fuente) mide la generalización.</text>
</svg>